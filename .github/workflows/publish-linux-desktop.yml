name: Publish a Linux desktop release

# Builds the AppImage + deb from the patch series on the one host that can build them and
# publishes them as a GitHub release. The verification that must pass *before* these bytes are
# published lives in the `Linux desktop verification` workflow; this workflow publishes only what
# that workflow already proved, and it re-verifies the bytes it is about to publish.
#
# Releases are deliberately not created on push. A tag is a claim that a specific set of bytes is
# good, so the tag is typed by a human who has read a green run.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.2.0-rc.2-linux.3 (must not already exist)'
        type: string
        required: true
      draft:
        description: Create the release as a draft, so it can be reviewed before it is public
        type: boolean
        default: true

permissions:
  contents: write

env:
  UPSTREAM_DIR: ${{ github.workspace }}/upstream
  # Upstream tag the patch series is based on; apply.sh reads the same default.
  BASE_TAG: dsh-v0.2.0-rc.2
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  publish:
    name: build, checksum, re-verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $RELEASE_TAG already exists; bump the tag input"
            exit 1
          fi
          echo "publishing a new release: $RELEASE_TAG"

      - name: Clone upstream and apply the patch series
        run: ./apply.sh "$UPSTREAM_DIR"

      - name: Record the patched tree hash
        # Published in the release notes so a reader can confirm which tree produced the bytes.
        run: |
          set -euo pipefail
          HASH=$(git -C "$UPSTREAM_DIR" rev-parse 'HEAD^{tree}')
          echo "PATCHED_TREE=$HASH" >> "$GITHUB_ENV"
          echo "patched tree: $HASH"

      - name: Install dependencies
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build the AppImage and the deb
        # One command, not the :dir step followed by the real one: the artifacts published here
        # must come from a single build of the whole tree.
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop run package:linux:x64 2>&1 | tee package.log
          ART="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          ls -l "$ART"/*.AppImage "$ART"/*.deb
        env:
          DSH_DESKTOP_TARGET_PLATFORM: linux
          DSH_DESKTOP_TARGET_ARCH: x64

      - name: Assemble the assets and their checksums
        # release-verify runs `sha256sum -c SHA256SUMS` inside the download directory, so the
        # manifest must reference the assets by bare filename.
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          set -euo pipefail
          ART="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          mkdir -p publish
          cp "$ART"/*.deb "$ART"/*.AppImage publish/
          cd publish
          # Bare filenames, matching the manifests already published, so `sha256sum -c` works in
          # any directory the assets are downloaded into.
          sha256sum *.deb *.AppImage > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
          file ./*.AppImage

      - name: Re-verify the exact bytes before publishing them
        # The published bytes, not a fresh build: install this deb, drive the session harness
        # against it, and boot this AppImage. This is release-verify's job performed pre-publish,
        # so a regression cannot reach a tag.
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq xvfb openbox xdotool dbus-x11 imagemagick libglib2.0-bin
          sudo apt-get install -yq "$PWD"/publish/*.deb
          dpkg -s deepseek-harness | sed -n '1,5p'
          ls -l /usr/bin/deepseek-harness
          xdg-mime query default x-scheme-handler/dsh

      - name: Desktop session against the bytes being published
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/session-publish"
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" \
            bash "$GITHUB_WORKSPACE/ci/desktop-session.sh" 2>&1 | tee "$GITHUB_WORKSPACE/session-publish/session.log"

      - name: AppImage boot of the bytes being published (no FUSE)
        run: |
          set -uo pipefail
          APPIMAGE=$(ls "$GITHUB_WORKSPACE"/upstream/publish/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          set +e
          timeout 40 xvfb-run -a ./"$APPIMAGE" --appimage-extract-and-run --no-sandbox --enable-logging > appimage.log 2>&1
          echo "APPIMAGE exit=$? (124 = it ran the full 40s)"
          set -e
          grep -q "dsh web: http" appimage.log || { echo "the AppImage never served its endpoint"; exit 1; }
          grep -qi "unsupported platform" appimage.log && { echo "desktop policy rejected the platform"; exit 1; }
          grep -q "transient AppImage mount" appimage.log && { echo "the shell refused the AppImage mount"; exit 1; }
          echo "PUBLISH-APPIMAGE: OK"

      - name: Write the release notes
        # Generated, not hand-written. A release body that accumulates per-run claims becomes a
        # ledger that has to be maintained by hand and drifts; the run list is the source of truth
        # for "is it green", and the tag plus the tree hash below identify these bytes exactly.
        run: |
          set -euo pipefail
          DEB=$(basename "$(ls "$UPSTREAM_DIR"/publish/*.deb | head -1)")
          APPIMAGE=$(basename "$(ls "$UPSTREAM_DIR"/publish/*.AppImage | head -1)")
          {
            echo "Unofficial Linux x86_64 desktop build, produced from this repository's patch series"
            echo "against upstream \`$BASE_TAG\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Upstream tag | \`$BASE_TAG\` |"
            echo "| Patched tree | \`$PATCHED_TREE\` |"
            echo "| Release tag | \`$RELEASE_TAG\` |"
            echo "| Workflow run | [$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo
            echo "Apply the series yourself and check the tree hash:"
            echo
            echo '```sh'
            echo "git clone https://github.com/$GITHUB_REPOSITORY.git"
            echo "sh apply.sh && git -C deepseek-harness rev-parse 'HEAD^{tree}'"
            echo "#   expect: $PATCHED_TREE"
            echo '```'
            echo
            echo "## Assets"
            echo
            echo "- \`$DEB\` — Debian, Ubuntu and compatible distributions"
            echo "- \`$APPIMAGE\` — portable use"
            echo "- \`SHA256SUMS\` — download verification (\`sha256sum -c SHA256SUMS\`)"
            echo
            echo '```sh'
            echo "sudo apt install ./$DEB"
            echo '```'
            echo
            echo "## What was verified before publishing"
            echo
            echo "These exact bytes were built, checksummed, installed and driven in the run linked"
            echo "above: the deb installs through apt, \`dsh://\` resolves to the package's desktop"
            echo "entry, the session harness exercises window creation / close-does-not-quit /"
            echo "relaunch / \`dsh://\` activation, and the AppImage boots with"
            echo "\`--appimage-extract-and-run\`. Full step-by-step logs are in that run."
            echo
            echo "Verification that covers the product core rather than the packaging — upstream's"
            echo "own Linux gate, the bwrap and Landlock sandbox legs, the keyless agent turn, and"
            echo "Debian 13 — lives in the \`Linux desktop verification\` workflow."
          } > "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
          cat "$GITHUB_WORKSPACE/RELEASE_NOTES.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--title "DeepSeek Harness Linux Desktop $RELEASE_TAG"
                --notes-file "$GITHUB_WORKSPACE/RELEASE_NOTES.md")
          [ "${{ inputs.draft }}" = "true" ] && ARGS+=(--draft)
          gh release create "$RELEASE_TAG" "$UPSTREAM_DIR"/publish/* \
            -R "$GITHUB_REPOSITORY" "${ARGS[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release $RELEASE_TAG"
            echo
            echo "Patched tree: \`$PATCHED_TREE\`"
            echo
            echo '```'
            ls -l "$UPSTREAM_DIR"/publish 2>/dev/null || echo "(no publish directory)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-publish-logs
          path: |
            upstream/package.log
            upstream/appimage.log
            session-publish/*.log
            session-publish/*.png
            upstream/publish/SHA256SUMS
          if-no-files-found: warn