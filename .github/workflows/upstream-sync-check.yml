name: Check upstream Harness sync

# Detect upstream tags that are newer than the Linux port's pinned base, then
# check whether the current patch series still applies and builds a Linux deb.
# This workflow validates compatibility and, when the patch series applies cleanly,
# opens a reviewable base-tag migration PR. It never publishes a release.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      upstream-tag:
        description: Optional upstream tag to check (defaults to the latest release tag)
        type: string
        required: false
      force:
        description: Revalidate even if the same inputs have a stored result
        type: boolean
        default: false

concurrency:
  group: upstream-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  UPSTREAM_REPO: https://github.com/deepseek-ai/deepseek-harness.git
  UPSTREAM_DIR: ${{ github.workspace }}/upstream

jobs:
  check:
    name: detect, apply patches and build deb
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      validated: ${{ steps.result.outputs.validated }}
      tag: ${{ steps.upstream.outputs.tag }}
      sha: ${{ steps.upstream.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned upstream base
        run: echo "CURRENT_BASE_TAG=$(cat ci/upstream-base-tag)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve the upstream tag
        id: upstream
        env:
          REQUESTED_TAG: ${{ inputs.upstream-tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            tag=$REQUESTED_TAG
          else
            tag=$(git ls-remote --tags --refs "$UPSTREAM_REPO" 'dsh-v*' \
              | awk '$2 !~ /-alpha([.-]|$)/ {sub("refs/tags/", "", $2); print $2}' \
              | sort -V | tail -n1)
          fi
          if [[ ! "$tag" =~ ^dsh-v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::could not resolve an upstream dsh-v* tag"
            exit 1
          fi
          git init upstream-tag-lookup
          git -C upstream-tag-lookup remote add origin "$UPSTREAM_REPO"
          git -C upstream-tag-lookup fetch --quiet --depth=1 origin "refs/tags/$tag"
          sha=$(git -C upstream-tag-lookup rev-parse 'FETCH_HEAD^{commit}')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_TAG=$tag" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$sha" >> "$GITHUB_ENV"
          echo "Resolved $tag at $sha"

      - name: Compare with the pinned base
        id: compare
        run: |
          set -euo pipefail
          if [ "$UPSTREAM_TAG" = "$CURRENT_BASE_TAG" ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "Upstream remains at the pinned tag $CURRENT_BASE_TAG."
            exit 0
          fi
          git init upstream-tags
          git -C upstream-tags remote add origin "$UPSTREAM_REPO"
          git -C upstream-tags fetch --quiet --depth=200 origin \
            "refs/tags/$CURRENT_BASE_TAG:refs/tags/$CURRENT_BASE_TAG" \
            "refs/tags/$UPSTREAM_TAG"
          candidate=$(git -C upstream-tags rev-parse 'FETCH_HEAD^{commit}')
          if git -C upstream-tags merge-base --is-ancestor "$CURRENT_BASE_TAG" "$candidate"; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
            echo "$UPSTREAM_TAG is newer than $CURRENT_BASE_TAG."
          else
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "$UPSTREAM_TAG is not a descendant of $CURRENT_BASE_TAG; manual review required."
          fi

      - name: Restore validation result for these exact inputs
        id: prior
        if: steps.compare.outputs.newer == 'true' && !inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/upstream-sync-state.sh restore

      - name: Free disk space
        if: steps.compare.outputs.newer == 'true' && steps.prior.outputs.status == ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Clone the candidate upstream tag
        if: steps.compare.outputs.newer == 'true' && steps.prior.outputs.status == ''
        run: |
          git clone --no-checkout "$UPSTREAM_REPO" "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" fetch --quiet origin \
            "refs/tags/$CURRENT_BASE_TAG:refs/tags/$CURRENT_BASE_TAG" \
            "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          git -C "$UPSTREAM_DIR" checkout -b linux-desktop-sync "$UPSTREAM_TAG"

      - name: Apply the Linux patch series
        id: apply
        if: steps.compare.outputs.newer == 'true' && steps.prior.outputs.status == ''
        continue-on-error: true
        run: |
          set -o pipefail
          git -C "$UPSTREAM_DIR" apply --3way "$GITHUB_WORKSPACE"/patches/*.patch 2>&1 | tee patch-apply.log

      - name: Install dependencies and build the Linux deb
        id: build
        if: steps.compare.outputs.newer == 'true' && steps.prior.outputs.status == '' && steps.apply.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.UPSTREAM_DIR }}
        env:
          DSH_DESKTOP_TARGET_PLATFORM: linux
          DSH_DESKTOP_TARGET_ARCH: x64
        run: |
          set -euo pipefail
          cp apps/desktop/.env.linux.example apps/desktop/.env.linux
          pnpm install --frozen-lockfile 2>&1 | tee "$GITHUB_WORKSPACE/dependencies.log"
          pnpm run typecheck 2>&1 | tee "$GITHUB_WORKSPACE/typecheck.log"
          pnpm run build:lib:host 2>&1 | tee "$GITHUB_WORKSPACE/build-lib-host.log"
          pnpm --dir apps/desktop run check:package 2>&1 | tee "$GITHUB_WORKSPACE/package-preflight.log"
          pnpm --dir apps/desktop run package:linux:x64 2>&1 | tee "$GITHUB_WORKSPACE/package.log"
          ls -lh apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb

      - name: Record validation result
        id: result
        if: always()
        env:
          PRIOR_STATUS: ${{ steps.prior.outputs.status }}
          PATCH_OUTCOME: ${{ steps.apply.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          status="$PRIOR_STATUS"
          if [ "$BUILD_OUTCOME" = success ]; then status=success; fi
          if [ "$PATCH_OUTCOME" = failure ] && \
            grep -Eq 'patch does not apply|with conflicts|does not match index|patch failed:|conflicts in index|does not exist in index' patch-apply.log; then
            status=conflict
          fi
          echo "validated=$([ "$status" = success ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Only explicit patch conflicts and completed builds are reusable.
          if [ -z "$PRIOR_STATUS" ] && [ -n "$status" ]; then
            printf '%s\n' "$status" > sync-validation-status.txt
          fi

      - name: Store completed validation result
        if: always() && steps.result.outputs.validated != ''
        uses: actions/upload-artifact@v4
        with:
          name: sync-result-${{ github.sha }}-${{ steps.upstream.outputs.sha }}
          path: sync-validation-status.txt
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      - name: Write sync report
        if: always()
        env:
          PATCH_OUTCOME: ${{ steps.apply.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          NEWER: ${{ steps.compare.outputs.newer }}
          PRIOR_STATUS: ${{ steps.prior.outputs.status }}
        run: |
          {
            printf '# Upstream sync check\n\n'
            printf -- '- Pinned base: `%s`\n' "$CURRENT_BASE_TAG"
            printf -- '- Candidate: `%s` (`%s`)\n' "${UPSTREAM_TAG:-unresolved}" "${UPSTREAM_SHA:-unresolved}"
            printf -- '- Newer descendant: `%s`\n' "$NEWER"
            printf -- '- Previous result for these inputs: `%s`\n' "${PRIOR_STATUS:-none}"
            printf -- '- Patch application: `%s`\n' "$PATCH_OUTCOME"
            printf -- '- Typecheck and deb build: `%s`\n' "$BUILD_OUTCOME"
            printf -- '- Repository commit: `%s`\n' "$GITHUB_SHA"
            printf '\nExisting conflicts are not retried until inputs change or force is selected. Build and infrastructure failures remain retryable.\n'
            if [ "$PRIOR_STATUS" = conflict ]; then
              printf '\n**Still blocked by the previously reported patch conflict.** See the original run linked above.\n'
            fi
            printf '\nThis workflow never publishes a release. PR creation is a separate job.\n'
          } | tee upstream-sync-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-sync-${{ steps.upstream.outputs.tag || 'unresolved' }}
          path: |
            upstream-sync-report.md
            patch-apply.log
            dependencies.log
            typecheck.log
            build-lib-host.log
            package-preflight.log
            package.log
          if-no-files-found: warn

      - name: Fail when the candidate could not be validated
        if: steps.compare.outputs.newer == 'true' && steps.prior.outputs.status == ''
        env:
          PATCH_OUTCOME: ${{ steps.apply.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          [ "$PATCH_OUTCOME" = success ] && [ "$BUILD_OUTCOME" = success ]

  migration-pr:
    name: open upstream base migration PR
    needs: check
    if: needs.check.outputs.validated == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read the pinned upstream base
        run: echo "CURRENT_BASE_TAG=$(cat ci/upstream-base-tag)" >> "$GITHUB_ENV"
      - name: Open an upstream base migration PR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
          CURRENT_BASE_TAG: ${{ env.CURRENT_BASE_TAG }}
        run: |
          set -euo pipefail
          branch="automation/upstream-${UPSTREAM_TAG#dsh-}"
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length' | grep -q '^0$'; then
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "::warning::main changed during validation; the next run will validate the new inputs."
              exit 0
            fi
            git switch -c "$branch" "$GITHUB_SHA"
            printf '%s\n' "$UPSTREAM_TAG" > ci/upstream-base-tag
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci/upstream-base-tag
            git commit -m "chore: migrate Linux patch base to $UPSTREAM_TAG"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              git fetch origin "refs/heads/$branch"
              if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$(git rev-parse 'HEAD^{tree}')" ]; then
                echo "::error::Existing automation branch differs from the validated migration; review it manually."
                exit 1
              fi
            else
              git push --set-upstream origin "$branch"
            fi
            cat > migration-pr.md <<EOF
          ## Upstream Harness migration

          The scheduled sync check applied the Linux patch series with \`git apply --3way\`
          and built a Linux deb successfully against \`$UPSTREAM_TAG\`.

          This PR updates the pinned base tag used by the patch application and
          verification workflows. It does not publish a release.

          - Previous base: \`$CURRENT_BASE_TAG\`
          - Candidate base: \`$UPSTREAM_TAG\`
          - Patch application: success
          - Linux deb build: success
          - Sync workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --draft --title "chore: migrate Linux patch base to $UPSTREAM_TAG" \
              --body-file migration-pr.md
          else
            echo "An open migration PR already exists for $branch; leaving it unchanged."
          fi
          gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open \
            --json url --jq '.[].url' >> "$GITHUB_STEP_SUMMARY"

