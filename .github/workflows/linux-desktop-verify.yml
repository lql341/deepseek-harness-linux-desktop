name: Linux desktop verification

# Verifies this patch set against the upstream DeepSeek Harness desktop app on the
# distribution the port targets (Ubuntu 24.04), because a CentOS HPC node cannot
# answer questions about glibc, Electron and Debian packaging for Ubuntu/Debian.

on:
  workflow_dispatch:
    inputs:
      upload-artifacts:
        description: Also upload the AppImage and deb (large)
        type: boolean
        default: false
      run-gates:
        description: Also run the long upstream gate aggregates (patched and baseline)
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'apply.sh'
      - '.github/workflows/linux-desktop-verify.yml'

permissions:
  contents: read

env:
  UPSTREAM_DIR: ${{ github.workspace }}/upstream
  # Upstream tag the patch series is based on; apply.sh reads the same default.
  BASE_TAG: dsh-v0.2.0-rc.2

jobs:
  typecheck:
    name: install + typecheck + package preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Environment report
        run: |
          echo "== runner =="
          uname -a
          cat /etc/os-release | head -3
          ldd --version | head -1
          echo "== disk =="
          df -h / | tail -1

      - name: Free disk space
        # The upstream checkout plus its dependency tree needs several GB; the
        # hosted image ships toolchains this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Toolchain
        run: |
          node -v
          pnpm -v
          git --version

      - name: Clone upstream and apply the patch series
        run: |
          ./apply.sh "$UPSTREAM_DIR"
          cd "$UPSTREAM_DIR"
          echo "== applied commits =="
          git log --oneline "$BASE_TAG..HEAD"
          echo "== patched tree hash (informational) =="
          git rev-parse "HEAD^{tree}"
          echo "== required local env file =="
          test -f apps/desktop/.env.linux && echo "apps/desktop/.env.linux present"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck the repository
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm run typecheck

      - name: Build the desktop application
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm --dir apps/desktop run build

      - name: Packaging preflight (validates .env.linux and the toolchain)
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm --dir apps/desktop run check:package
        env:
          # check:package resolves the host target, which is linux-x64 on this runner.
          DSH_DESKTOP_TARGET_PLATFORM: linux

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "== node/pnpm =="
            node -v; pnpm -v
            echo "== upstream head =="
            git -C "$UPSTREAM_DIR" log --oneline -3 || true
            echo "== env file =="
            ls -l "$UPSTREAM_DIR/apps/desktop/.env.linux" || true
          } > typecheck-summary.txt 2>&1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typecheck-logs
          path: typecheck-summary.txt
          if-no-files-found: warn

  package:
    name: package --dir + artifact inspection + runtime smoke
    needs: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone upstream and apply the patch series
        run: ./apply.sh "$UPSTREAM_DIR"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build the unpacked Linux application
        # Every package command builds the repository itself, so no separate build step is needed.
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm --dir apps/desktop run package:linux:x64:dir
        env:
          DSH_DESKTOP_TARGET_PLATFORM: linux
          DSH_DESKTOP_TARGET_ARCH: x64

      - name: Inspect the unpacked application
        # app.asar is an archive *file*, not a directory, and the bundled dsh payload sits
        # inside it (asarUnpack only holds .node/.so/.dll binaries, ripgrep, the
        # libreoffice kit and the Landlock launcher). A shell test on app.asar/dsh/... can
        # therefore only ever report MISSING, so the payload is probed through the shipped
        # Electron runtime, which patches fs for asar.
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          set -uo pipefail
          ARTIFACTS="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          APP="$ARTIFACTS/linux-unpacked"
          FAILED=0
          {
            echo "== artifact directory =="
            ls -la "$ARTIFACTS" || true
            echo
            echo "== application root (top level) =="
            ls -la "$APP" | head -30 || true
            echo
            echo "== launcher =="
            LAUNCHER="$APP/DeepSeek Harness"
            [ -x "$LAUNCHER" ] || LAUNCHER="$APP/deepseek-harness"
            if [ -x "$LAUNCHER" ]; then
              ls -l "$LAUNCHER"
            else
              echo "MISSING launcher (no executable launcher in $APP)"; FAILED=1
            fi
            echo
            echo "== bundled runtime present =="
            if [ -f "$APP/resources/app.asar" ]; then
              echo "app.asar present"
            else
              echo "MISSING app.asar"; FAILED=1
            fi
            ELECTRON_RUN_AS_NODE=1 "$LAUNCHER" -e 'const fs=require("node:fs");let bad=0;for(const p of process.argv.slice(1)){const ok=fs.existsSync(p);if(!ok)bad++;console.log((ok?"present  ":"MISSING  ")+p)}process.exit(bad?1:0)' \
              "$APP/resources/app.asar/dsh/package.json" \
              "$APP/resources/app.asar/dsh/node_modules/@deepseek-ai/dsh-desktop-host/lib/cli.js" \
              || { echo "the bundled dsh payload is not readable inside app.asar"; FAILED=1; }
            echo
            echo "== Linux native packages in the unpacked tree =="
            for p in node-pty sharp-linux koffi-linux ripgrep-linux node-addon-system-linux sherpa-onnx-linux libreoffice-kit-wasm; do
              printf '%-32s' "$p"
              if find "$APP/resources" -maxdepth 6 -name "*${p}*" -print -quit 2>/dev/null | grep -q .; then
                echo "present"
              else
                echo "MISSING"; FAILED=1
              fi
            done
            echo
            echo "== foreign-platform files outside the bundled pnpm payload (must be empty) =="
            FOREIGN=$(find "$APP/resources" -maxdepth 6 \
              \( -name "*-darwin-*" -o -name "*-win32-*" -o -name "*.dll" -o -name "*.exe" \) \
              2>/dev/null | grep -v '/resources/runtime/pnpm/' | head -20 || true)
            if [ -n "$FOREIGN" ]; then
              echo "$FOREIGN"; echo "UNEXPECTED foreign-platform files in the application payload"; FAILED=1
            else
              echo "(none)"
            fi
            echo
            # resources/runtime/pnpm is a verbatim copy of the published pnpm package
            # (prepare-runtime.ts cpSyncs the whole package directory), so it carries its
            # own cross-platform vendored helpers on every platform. The shipped macOS
            # build contains exactly the same files; they are informational, not leakage.
            echo "== the same names inside the bundled pnpm payload (expected, informational) =="
            find "$APP/resources/runtime/pnpm" -maxdepth 6 \
              \( -name "*-darwin-*" -o -name "*-win32-*" -o -name "*.dll" -o -name "*.exe" \) \
              2>/dev/null | head -10 || true
            echo
            echo "== linux node-pty prebuild =="
            find "$APP/resources" -path "*node-pty*prebuilds*" -maxdepth 8 2>/dev/null | head -10 || true
          } > inspection.log 2>&1
          cat inspection.log
          exit "$FAILED"

      - name: Headless runtime smoke (no display needed)
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          set -uo pipefail
          APP="apps/desktop/.desktop-build/targets/linux-x64/artifacts/linux-unpacked"
          BIN="$APP/DeepSeek Harness"
          [ -x "$BIN" ] || BIN="$APP/deepseek-harness"
          # The payload lives inside app.asar, so there is no shell-visible file to test for:
          # Electron resolves the archive path itself, exactly the way the app loads it.
          HOST_CLI="$APP/resources/app.asar/dsh/node_modules/@deepseek-ai/dsh-desktop-host/lib/cli.js"
          rc=0
          {
            echo "SMOKE: binary=$BIN"
            echo "SMOKE: host cli=$HOST_CLI"
            if [ ! -x "$BIN" ]; then echo "SMOKE RESULT: FAIL (no launcher)"; rc=1; fi
            if [ "$rc" -eq 0 ]; then
              ELECTRON_RUN_AS_NODE=1 "$BIN" --expose-internals "$HOST_CLI" --version 2>&1 | tail -20
              status=${PIPESTATUS[0]}
              echo "SMOKE RESULT: exit=$status"
              if [ "$status" -ne 0 ]; then rc=1; fi
            fi
          } > smoke.log 2>&1
          cat smoke.log
          # A failed smoke must fail the job: the previous revision exited 0 from inside
          # the group, so a missing payload still reported a green step.
          exit "$rc"

      - name: GUI smoke under Xvfb (best effort)
        working-directory: ${{ env.UPSTREAM_DIR }}
        continue-on-error: true
        run: |
          set -uo pipefail
          APP="apps/desktop/.desktop-build/targets/linux-x64/artifacts/linux-unpacked"
          BIN="$APP/DeepSeek Harness"
          [ -x "$BIN" ] || BIN="$APP/deepseek-harness"
          {
            echo "GUI-SMOKE: launching under Xvfb for 40s"
            # --no-sandbox: the hosted runner has no usable SUID sandbox helper.
            timeout 40 xvfb-run -a "$BIN" --no-sandbox --enable-logging 2>&1 | head -120
            echo "GUI-SMOKE: finished (timeout or exit above)"
          } > gui-smoke.log 2>&1
          cat gui-smoke.log

      - name: Package formats (AppImage + deb)
        working-directory: ${{ env.UPSTREAM_DIR }}
        continue-on-error: true
        run: |
          pnpm --dir apps/desktop run package:linux:x64 > package-formats.log 2>&1 || echo "PACKAGE-FORMATS: failed (see log)"
          tail -40 package-formats.log
          ls -la apps/desktop/.desktop-build/targets/linux-x64/artifacts | tail -10
        env:
          DSH_DESKTOP_TARGET_PLATFORM: linux
          DSH_DESKTOP_TARGET_ARCH: x64

      - name: Install the deb and exercise the installed command
        # Everything a real host does: install, register the deep link, run the GUI binary as a
        # Node runtime, run the staged launcher, install `dsh` the way the app does, use it from
        # PATH, remove it, uninstall.
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          set -euo pipefail
          ART="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          DEB=$(ls "$ART"/*.deb | head -1)
          PACKAGE=$(dpkg-deb -f "$DEB" Package)
          ls -l "$DEB"
          sudo apt-get install -y "$PWD/$DEB"
          dpkg -s "$PACKAGE" | sed -n '1,8p'
          APP_DIR=$(dpkg -L "$PACKAGE" | sed -n 's#^\(/opt/[^/]*\)/resources/app\.asar$#\1#p' | head -1)
          echo "DEB-E2E: installed under $APP_DIR"
          test -d "$APP_DIR"

          echo "== what the package put on PATH =="
          ls -l /usr/bin/deepseek-harness
          readlink "$(command -v deepseek-harness)" || true

          echo "== desktop entry and dsh:// registration =="
          ls /usr/share/applications/
          xdg-mime query default x-scheme-handler/dsh
          HANDLER=$(xdg-mime query default x-scheme-handler/dsh)
          test -n "$HANDLER" || { echo "DEB-E2E: dsh:// is not registered"; exit 1; }

          echo "== the installed binary really is an Electron runtime =="
          ELECTRON_RUN_AS_NODE=1 /usr/bin/deepseek-harness -p 'process.versions.node + " node / electron " + process.versions.electron'

          echo "== the staged launcher must reach the payload inside app.asar =="
          "$APP_DIR/resources/runtime/cli/bin/dsh" --version

          echo "== install ~/.local/bin/dsh the way the app does, then run it from PATH =="
          MANAGER="$APP_DIR/resources/runtime/cli/command-manager.js"
          # Every mutation is confirmed against the fingerprint the entry has right now, so the
          # removal has to inspect again: the install necessarily changed the entry.
          manage() {
            # Keep the banner off stdout: the callers parse the JSON the worker prints.
            echo "== command-manager $1 ==" >&2
            ELECTRON_RUN_AS_NODE=1 /usr/bin/deepseek-harness "$MANAGER" "$1" ${2:+"$2"}
          }
          fingerprint() { python3 -c 'import json,sys;print(json.load(sys.stdin)["state"]["fingerprint"])'; }

          STATE=$(manage inspect)
          echo "$STATE"
          FP=$(printf '%s' "$STATE" | fingerprint)
          test -n "$FP"
          manage install "$FP"
          ls -l "$HOME/.local/bin/dsh"
          PATH="$HOME/.local/bin:$PATH" dsh --version

          echo "== remove it again =="
          FP=$(manage inspect | fingerprint)
          manage remove "$FP"
          test ! -e "$HOME/.local/bin/dsh"

          echo "== uninstall the package =="
          sudo apt-get remove -y "$PACKAGE"
          test ! -e /usr/bin/deepseek-harness
          test ! -d "$APP_DIR"
          echo "DEB-E2E: OK"

      - name: "AppImage smoke (no FUSE: --appimage-extract-and-run)"
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          set -euo pipefail
          ART="apps/desktop/.desktop-build/targets/linux-x64/artifacts"
          APPIMAGE=$(ls "$ART"/*.AppImage | head -1)
          ls -l "$APPIMAGE"
          file "$APPIMAGE" || true
          echo "== the runner ships no libfuse, so this is also the Ubuntu 23.10+ path =="
          ./"$APPIMAGE" --appimage-version || true
          set +e
          timeout 40 xvfb-run -a ./"$APPIMAGE" --appimage-extract-and-run --no-sandbox --enable-logging > appimage-smoke.log 2>&1
          echo "APPIMAGE exit=$? (124 = it ran the full 40s)"
          set -e
          head -25 appimage-smoke.log || true
          grep -q "transient AppImage mount" appimage-smoke.log && { echo "the shell refused the AppImage mount"; exit 1; }
          grep -qi "unsupported platform" appimage-smoke.log && { echo "desktop policy rejected the platform"; exit 1; }
          grep -q "dsh web: http" appimage-smoke.log || { echo "the AppImage never served its endpoint"; exit 1; }
          echo "APPIMAGE-SMOKE: OK"

      - name: Desktop test suite on Linux (informational baseline)
        # Upstream never ran this suite on Linux; record the baseline instead of gating on it.
        working-directory: ${{ env.UPSTREAM_DIR }}
        continue-on-error: true
        run: |
          # The repository's own `test` script builds the native system addon first; running
          # vitest alone fails macos-notarization-proxy on "flock addon is not built".
          { pnpm run build:native-system && pnpm exec vitest run apps/desktop; } > desktop-tests.log 2>&1 \
            || echo "DESKTOP-TESTS: failures recorded (no Linux baseline upstream)"
          tail -60 desktop-tests.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-logs
          path: |
            upstream/inspection.log
            upstream/smoke.log
            upstream/gui-smoke.log
            upstream/package-formats.log
            upstream/appimage-smoke.log
            upstream/desktop-tests.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload-artifacts }}
        with:
          name: linux-artifacts
          path: |
            upstream/apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.AppImage
            upstream/apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## Linux desktop verification"
            echo
            echo '```'
            cat upstream/smoke.log 2>/dev/null || echo "(no smoke log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  linux-gates:
    # Product-core coverage the packaging job does not reach: upstream's own Linux gate
    # aggregate (static gates, contracts, lint, whole-repository coverage, module graph,
    # build, publint, built-package invariants and the built-binary keyless smoke), then the
    # real-kernel sandbox legs and the keyless agent turn on its own.
    name: upstream Linux gates, sandbox confinement, keyless agent smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-gates }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone upstream and apply the patch series
        run: ./apply.sh "$UPSTREAM_DIR"

      - name: Install dependencies and prepare bubblewrap
        # Upstream's own recipe: pinned payload extracted into RUNNER_TEMP, plus the
        # AppArmor userns knob, so the bwrap rung can be exercised rather than skipped.
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if [ "$install_status" -ne 0 ]; then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Install Playwright browsers
        # The web snapshot gates launch a real browser; upstream installs these before the gate.
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium webkit

      - name: Upstream Linux primary gate
        id: gate
        continue-on-error: true
        working-directory: ${{ env.UPSTREAM_DIR }}
        env:
          NO_COLOR: 1
          # Upstream runs this aggregate serially. Without it the oxlint contract gate deletes its
          # temporary client file while the typecheck gate is reading it (TS6053), and a four-core
          # runner turns the heavy suites into timeouts.
          DSH_GATE_CONCURRENCY: '1'
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_E2E_MAX_WORKERS: '1'
          DSH_OXLINT_THREADS: '2'
          DSH_PUBLINT_CONCURRENCY: '1'
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: |
          set -o pipefail
          pnpm run check:ci:linux-primary 2>&1 | tee linux-gates.log

      - name: Build the Landlock launcher for this architecture
        continue-on-error: true
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          # Upstream's sandbox workflow installs musl-tools for the static launcher.
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools
          pnpm --dir native/system run build:ts
          pnpm --dir native/system run build:native

      - name: Sandbox confinement e2e (real kernel, bwrap and Landlock legs)
        id: sandbox
        if: always()
        continue-on-error: true
        working-directory: ${{ env.UPSTREAM_DIR }}
        env:
          NO_COLOR: 1
        run: |
          set -u +e -o pipefail
          status=0
          for leg in bwrap landlock; do
            echo "== sandbox leg: $leg =="
            out=$(pnpm exec vitest run --config vitest.e2e.config.ts \
              "packages/sandbox/sandbox-local/tests/$leg.e2e.ts" \
              "packages/shell/bash-sandbox/tests/$leg.e2e.ts" 2>&1) || status=1
            echo "$out"
            # A self-skip on the platform that exists to prove the rung is a failure.
            echo "$out" | grep -qE 'Test Files[[:space:]]+2 passed \(2\)' \
              || { echo "SANDBOX: the $leg leg did not run both files"; status=1; }
          done
          exit "$status"

      - name: Keyless agent smoke (real Loader, production bash tool)
        id: keyless
        if: always()
        continue-on-error: true
        working-directory: ${{ env.UPSTREAM_DIR }}
        env:
          NO_COLOR: 1
        run: |
          set -u +e -o pipefail
          # built-bin smoke expects the build; keep this step self-sufficient so a gate
          # failure earlier in the job cannot masquerade as a keyless-smoke failure.
          pnpm run build || true
          out=$(pnpm exec vitest run --config vitest.e2e.config.ts \
            apps/cli/tests/profiles/headless/tests/keyless-smoke.e2e.ts 2>&1); status=$?
          echo "$out"
          echo "$out" | grep -qE 'Test Files[[:space:]]+1 passed \(1\)' \
            || { echo "KEYLESS: the smoke did not run"; status=1; }
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-gates-logs
          path: upstream/linux-gates.log
          if-no-files-found: warn

      - name: Verdict
        if: always()
        run: |
          echo "upstream Linux gate : ${{ steps.gate.outcome }}"
          echo "sandbox confinement : ${{ steps.sandbox.outcome }}"
          echo "keyless agent smoke : ${{ steps.keyless.outcome }}"
          failed=0
          [ "${{ steps.gate.outcome }}" = success ] || { echo "FAIL: upstream Linux gate"; failed=1; }
          [ "${{ steps.sandbox.outcome }}" = success ] || { echo "FAIL: sandbox confinement e2e"; failed=1; }
          [ "${{ steps.keyless.outcome }}" = success ] || { echo "FAIL: keyless agent smoke"; failed=1; }
          exit "$failed"

  linux-gates-baseline:
    # Attribution, not verification: the same gate on the unpatched base tag, so every failure
    # in the patched run can be classified as ours or as pre-existing on this runner.
    name: same gate on the unpatched base tag (attribution)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: true
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-gates }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone the base tag without any patch
        run: |
          git clone --branch "$BASE_TAG" --depth 1 \
            https://github.com/deepseek-ai/deepseek-harness.git "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" log --oneline -1
          git -C "$UPSTREAM_DIR" status --porcelain

      - name: Install dependencies and prepare bubblewrap
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if [ "$install_status" -ne 0 ]; then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Install Playwright browsers
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium webkit

      - name: Baseline Linux primary gate (unpatched)
        id: baseline
        continue-on-error: true
        working-directory: ${{ env.UPSTREAM_DIR }}
        env:
          NO_COLOR: 1
          # Identical posture to the patched run, so the two are comparable.
          DSH_GATE_CONCURRENCY: '1'
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_E2E_MAX_WORKERS: '1'
          DSH_OXLINT_THREADS: '2'
          DSH_PUBLINT_CONCURRENCY: '1'
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: |
          set -o pipefail
          pnpm run check:ci:linux-primary 2>&1 | tee linux-gates-baseline.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-gates-baseline-logs
          path: upstream/linux-gates-baseline.log
          if-no-files-found: warn

      - name: Baseline summary
        if: always()
        run: |
          echo "unpatched base tag gate: ${{ steps.baseline.outcome }}"
          tail -20 upstream/linux-gates-baseline.log 2>/dev/null || true

  release-verify:
    # Verifies the bytes that were actually published, not a fresh CI build: download the release
    # assets, check them against the bundled SHA256SUMS, install the deb and drive a real
    # (headless) desktop session - window creation, close-does-not-quit, single-instance routing
    # and dsh:// activation - then boot the published AppImage without FUSE.
    name: published artifacts - checksums, install, desktop session, AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          gh release download v0.2.0-rc.2-linux.2 -R "$GITHUB_REPOSITORY" \
            -p '*.deb' -p '*.AppImage' -p 'SHA256SUMS' -D release
          ls -l release

      - name: Verify the published checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Install a desktop session and the published deb
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb openbox xdotool dbus-x11 imagemagick libglib2.0-bin
          sudo apt-get install -yq ./release/*.deb
          dpkg -s deepseek-harness | sed -n '1,5p'
          ls -l /usr/bin/deepseek-harness

      - name: Desktop session (window, close-does-not-quit, relaunch, dsh:// activation)
        env:
          SHOT_DIR: ${{ github.workspace }}/session
        run: |
          set -o pipefail
          mkdir -p "$SHOT_DIR"
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" \
            bash ci/desktop-session.sh 2>&1 | tee session.log

      - name: Published AppImage boot (no FUSE)
        run: |
          set -uo pipefail
          APPIMAGE=$(ls release/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          file "$APPIMAGE" || true
          set +e
          timeout 40 xvfb-run -a ./"$APPIMAGE" --appimage-extract-and-run --no-sandbox --enable-logging > appimage.log 2>&1
          echo "APPIMAGE exit=$? (124 = it ran the full 40s)"
          set -e
          grep -q "dsh web: http" appimage.log || { echo "the published AppImage never served its endpoint"; exit 1; }
          grep -qi "unsupported platform" appimage.log && { echo "desktop policy rejected the platform"; exit 1; }
          echo "PUBLISHED-APPIMAGE: OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verify-logs
          path: |
            session.log
            appimage.log
            session/*.png
          if-no-files-found: warn
